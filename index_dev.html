<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8"/>
  <title>Egenskapsvalidering v4.05</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  
  <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap');

    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --surface2:  #1f2937;
      --border:    #30363d;
      --ink:       #e6edf3;
      --muted:     #7d8590;
      --green:     #3fb950;
      --green-dim: #1a3a22;
      --yellow:    #d29922;
      --yellow-dim:#2d2205;
      --red:       #f85149;
      --red-dim:   #3a1212;
      --blue:      #58a6ff;
      --blue-dim:  #0d2044;
      --mono:      'JetBrains Mono', monospace;
      --sans:      'Syne', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body { background: var(--bg); color: var(--ink); font-family: var(--sans); min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .header-title { flex: 1; }
    .header-title h1 { font-size: 16px; font-weight: 800; letter-spacing: -.3px; color: var(--ink); }
    .header-title p { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-top: 1px; }

    .badge { font-family: var(--mono); font-size: 10px; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }

    .btn { font-family: var(--sans); font-size: 12px; font-weight: 700; padding: 7px 14px; border-radius: 6px; border: none; cursor: pointer; transition: opacity .15s, transform .1s; white-space: nowrap; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn:not(:disabled):hover { opacity: .85; }
    .btn:not(:disabled):active { transform: scale(.97); }
    .btn-primary { background: var(--blue); color: #000; }
    .btn-ghost   { background: var(--surface2); color: var(--ink); border: 1px solid var(--border); }
    .btn-danger  { background: #21262d; color: var(--red); border: 1px solid #3a1c1c; }
    .btn-colorize { background: #1a3a22; color: var(--green); border: 1px solid #2a5a32; }
    .btn-unreset  { background: #1f2937; color: var(--muted); border: 1px solid var(--border); }
    .btn-export   { background: #0d2044; color: var(--blue); border: 1px solid #1a3a6c; }

    #statusBar { font-family: var(--mono); font-size: 11px; padding: 6px 16px; background: var(--blue-dim); color: var(--blue); border-bottom: 1px solid #1a3a5c; flex-shrink: 0; }
    #statusBar.ok    { background: var(--green-dim); color: var(--green); border-color: #1a3a22; }
    #statusBar.error { background: var(--red-dim);   color: var(--red);   border-color: #3a1212; }

    #modelBar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 8px 16px; display: flex; gap: 15px; align-items: center; flex-shrink: 0; }
    .select-group { display: flex; align-items: center; gap: 8px; flex: 1; }
    #modelBar label { font-size: 11px; color: var(--muted); font-family: var(--mono); white-space: nowrap; }
    select { font-family: var(--mono); font-size: 12px; background: var(--surface2); color: var(--ink); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; width: 100%; min-width: 0; }
    select:disabled { opacity: .4; }

    main { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }

    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
    .card .label { font-size: 10px; color: var(--muted); font-family: var(--mono); text-transform: uppercase; letter-spacing: .5px; }
    .card .value { font-size: 28px; font-weight: 800; line-height: 1.1; margin-top: 4px; }
    .card .sub { font-size: 10px; color: var(--muted); font-family: var(--mono); margin-top: 3px; }
    .card.green .value { color: var(--green); }
    .card.red .value { color: var(--red); }
    .card.blue .value { color: var(--blue); }
    .card.gray .value { color: var(--muted); }
    .card.gray { border-color: #30363d; }

    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .panel-header { padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
    .panel-header h3 { font-size: 13px; font-weight: 700; flex: 1; }

    #fieldChart { padding: 14px; display: flex; flex-direction: column; gap: 7px; height: 220px; overflow: auto; resize: vertical; }
    .field-row { display: flex; align-items: center; gap: 10px; }
    .field-name { font-family: var(--mono); font-size: 10px; color: var(--muted); width: 180px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-track { flex: 1; height: 16px; background: var(--surface2); border-radius: 4px; overflow: hidden; display: flex; }
    .bar-fill-ok   { background: var(--green); height: 100%; transition: width .5s cubic-bezier(.4,0,.2,1); }
    .bar-pct { font-family: var(--mono); font-size: 10px; width: 48px; text-align: right; flex-shrink: 0; color: var(--ink); }

    .table-wrap { overflow: auto; height: 45vh; min-height: 150px; resize: vertical; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; }
    thead th { background: var(--surface2); color: var(--muted); font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .4px; padding: 8px 10px; text-align: left; position: sticky; top: 0; z-index: 1; white-space: nowrap; }
    tbody tr { border-bottom: 1px solid #1c2128; cursor: pointer; }
    tbody tr:hover td { background: #1c2128; }
    tbody td { padding: 6px 10px; vertical-align: middle; font-family: var(--mono); font-size: 10px; color: var(--ink); }
    .obj-name { color: var(--blue); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .field-value { display: inline-block; padding: 3px 6px; border-radius: 4px; font-size: 9px; font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; border: 1px solid transparent; }
    .field-value.ok { background: var(--green-dim); color: var(--green); border-color: #1e4028; }
    .field-value.warn { background: var(--yellow-dim); color: var(--yellow); border-color: #3a2d05; }
    .field-value.miss { background: var(--red-dim); color: var(--red); border-color: #3a1212; }
    .field-value.opt { background: #1a2027; color: var(--muted); border-color: #30363d; }
    .field-value.na { background: #2a2f36; color: var(--muted); border-color: #30363d; }

    #donutWrap { display: flex; align-items: center; gap: 20px; padding: 14px; min-height: 220px; }
    #donutSvg  { flex-shrink: 0; }
    .donut-legend { display: flex; flex-direction: column; gap: 6px; }
    .legend-item  { display: flex; align-items: center; gap: 8px; font-size: 11px; }
    .legend-dot   { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    .empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(6px); }
      to   { opacity:1; transform:none; }
    }
    .anim { animation: fadeUp .3s ease both; }
    .grid-2col { display: grid; grid-template-columns: 1fr 1.5fr; gap: 14px; align-items: start; }
  </style>
</head>
<body>

<header>
  <div class="header-title">
    <h1>Egenskapsvalidering v4.05</h1>
    <p>Cache-Buster aktivert og robust Prosesskode-kutter</p>
  </div>
  <span class="badge" id="modelBadge">Frakoblet</span>
  <button class="btn btn-ghost" id="btnLoad" disabled>Hent modeller</button>
  <button class="btn btn-primary" id="btnValidate" disabled>▶ Valider</button>
  <button class="btn btn-colorize" id="btnColorize" disabled>🎨 Fargelegg</button>
  <button class="btn btn-unreset" id="btnUncolor" disabled>⬜ Fjern farger</button>
  <button class="btn btn-export" id="btnExport" disabled>⬇ Eksporter CSV</button>
  <button class="btn btn-danger" id="btnReset" disabled>↺ Nullstill</button>
</header>

<div id="statusBar">Kobler til Trimble Connect...</div>

<div id="modelBar">
  <div class="select-group">
    <label>Regelsett:</label>
    <select id="ruleSelect">
      <option value="0_Element.json">0_Element</option>
      <option value="1_FAG.json">1_FAG (Dynamisk)</option>
      <option value="2_RDS.json">2_RDS (Intelligent)</option>
      <option value="3_Beskrivelse.json">3_Beskrivelse</option>
    </select>
  </div>
  
  <div class="select-group">
    <label>Modell:</label>
    <select id="modelSelect" disabled><option value="">– Laster... –</option></select>
  </div>
</div>

<main id="mainContent">
  <div class="empty anim">Velg et regelsett og en modell fra menyen, og trykk <strong>Valider</strong>.</div>
</main>

<script>
let API = null;
let allModels = [];
let validationRows = [];
let currentRelevantFields = [];
let skippedCount = 0;

const IGNORE = new Set(['IFCPROJECT','IFCSITE','IFCBUILDING','IFCBUILDINGSTOREY','IFCSPACE','IFCZONE','IFCGROUP','IFCSYSTEM']);

const $ = id => document.getElementById(id);
const setStatus = (m, c='') => { $('statusBar').textContent = m; $('statusBar').className = c; };
const lastPathPart = (v) => (v || '').split('/').pop().split('\\').pop();
const esc = (v) => (v ?? '').toString().replace(/[&<>"]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s]));

function getIfcType(obj){
    const s = (obj.class || obj.className || obj.type || obj.ifcType || obj.ifcEntity || '').toString().trim().toUpperCase();
    if (s && s.startsWith('IFC')) return s;
    for (const ps of (obj.properties || [])) {
        for (const p of (ps.properties || [])) {
            const v = (p.value || '').toString().trim().toUpperCase();
            if (v.startsWith('IFC')) return v;
        }
    }
    return '';
}

async function connect(){
  try {
    API = await window.TrimbleConnectWorkspace.connect(window.parent);
    $('btnLoad').disabled = false;
    $('btnValidate').disabled = false;
    setStatus('✅ Tilkoblet Trimble Connect.', 'ok');
    $('modelBadge').textContent = 'Tilkoblet';
  } catch(e) { setStatus('❌ Kunne ikke koble til API.', 'error'); }
}

async function loadModels(){
  if (!API) return;
  setStatus('⏳ Leser modeller og filnavn...');
  try {
    const nameMap = new Map();
    const srcs = [() => API.models?.getModels(), () => API.viewer?.getModels()];
    for (const src of srcs) {
      try {
        const res = await src();
        const list = Array.isArray(res) ? res : (res?.models || res?.items || []);
        list.forEach(m => {
          const id = m.id || m.modelId;
          const fn = [m.name, m.fileName, m.filename].find(v => /\.ifc/i.test(v));
          if (id && fn) nameMap.set(id, lastPathPart(fn));
        });
      } catch(e){}
    }

    const objs = await API.viewer.getObjects();
    allModels = (objs || []).map(m => {
      const mid = m.modelId || m.modelid;
      return {
        id: mid,
        name: nameMap.get(mid) || m.name || 'Ukjent modell',
        objectIds: (m.objects || []).map(o => o.id || o.objectRuntimeId).filter(id => id != null)
      };
    }).filter(m => m.objectIds.length > 0);

    $('modelSelect').innerHTML = allModels.map(m => `<option value="${m.id}">${esc(m.name)} (${m.objectIds.length} obj)</option>`).join('');
    $('modelSelect').disabled = false;
    setStatus('✅ Modeller hentet.', 'ok');
  } catch(e) { setStatus('❌ Feil ved henting: ' + e.message, 'error'); }
}

// --- STANDARD VALIDERINGS-MOTOR ---
function runValidation(objProps, fullRules) {
  let fields = {}, ok = 0, miss = 0, warn = 0;
  const props = objProps.flat;
  const disc = (props["Underdisiplinkode"] || "").toUpperCase();
  const mmi = parseInt(props["MMI"]) || 0;

  for (const [propKeys, rule] of Object.entries(fullRules?.properties || {})) {
    propKeys.split('|').forEach(propName => {
      propName = propName.trim();
      if (!propName) return;

      const val = props[propName] || '';
      let req = rule.requirement || rule.defaultRequirement;

      if (rule.overrides) {
        const override = rule.overrides.find(o => {
          if (!o.conditions) return false;
          return Object.entries(o.conditions).every(([k, v]) => {
            const objV = String(props[k] || '').trim().toUpperCase();
            return Array.isArray(v) ? v.some(x => String(x).trim().toUpperCase() === objV) : String(v).trim().toUpperCase() === objV;
          });
        });
        if (override) req = override.requirement;
      }

      if (rule.minMMI && mmi > 0 && mmi < rule.minMMI && req === 'required') {
        req = 'optional';
      }

      let isFormatError = false;
      let errMsg = '';
      const strVal = val.toString().trim();

      if (req === 'notallowed') {
        if (strVal !== "") { fields[propName] = { status: 'warn', value: val, msg: 'Ikke tillatt' }; warn++; } 
        else { fields[propName] = { status: 'na', value: '-', msg: 'Ikke tillatt' }; }
        return; 
      }

      if (req === 'required' && strVal === "") {
         fields[propName] = { status: 'miss', value: '', msg: 'Mangler' }; miss++; return;
      }

      if (strVal === "") {
         fields[propName] = { status: 'opt', value: 'Ikke påkrevd', msg: 'Valgfri' }; return;
      }

      if (rule.format && !(new RegExp(rule.format).test(val))) { 
         isFormatError = true; errMsg = 'Feil format'; 
      }

      if (!isFormatError && rule.disallowedValues) {
        const disallowed = Array.isArray(rule.disallowedValues) ? rule.disallowedValues : [rule.disallowedValues];
        if (disallowed.some(v => String(v).trim().toUpperCase() === strVal.toUpperCase())) {
          isFormatError = true; errMsg = `Ugyldig verdi '${val}'`;
        }
      }

      if (!isFormatError && rule.allowedValues) {
        if (Array.isArray(rule.allowedValues)) {
            const allowed = rule.allowedValues;
            if (!allowed.some(v => String(v).trim().toUpperCase() === strVal.toUpperCase())) {
              isFormatError = true; errMsg = 'Verdi ikke i liste';
            }
        } else if (typeof rule.allowedValues === 'object') {
            const fagKey = Object.keys(rule.allowedValues).find(k => k.toUpperCase() === disc.toUpperCase());
            if (fagKey) {
                const allowedForFag = rule.allowedValues[fagKey];
                
                if (Array.isArray(allowedForFag)) {
                    if (!allowedForFag.some(v => String(v).trim().toUpperCase() === strVal.toUpperCase())) {
                        isFormatError = true; errMsg = `Ugyldig for ${disc}`;
                    }
                } else if (typeof allowedForFag === 'object') {
                    const klasse = String(props["Objektklasse"] || '').trim();
                    const klasseKey = Object.keys(allowedForFag).find(k => k.toUpperCase() === klasse.toUpperCase());
                    
                    if (klasseKey) {
                        const validTypes = allowedForFag[klasseKey];
                        if (Array.isArray(validTypes) && !validTypes.some(v => String(v).trim().toUpperCase() === strVal.toUpperCase())) {
                            isFormatError = true; errMsg = `Ugyldig for ${klasse}`;
                        }
                    } else if (klasse) {
                        isFormatError = true; errMsg = `Ukjent klasse ${klasse}`;
                    }
                }
            }
        }
      }

      if (isFormatError) { fields[propName] = { status: 'warn', value: val, msg: errMsg }; warn++; } 
      else { fields[propName] = { status: 'ok', value: val, msg: 'OK' }; ok++; }
    });
  }

  const totalReq = ok + miss + warn;
  const score = totalReq > 0 ? Math.round((ok / totalReq) * 100) : 100;
  return { fields, score, miss, warn };
}

// --- DEDIKERT RDS KRYSSREFERANSE-MOTOR ---
function runRdsValidation(objProps, rules) {
  let fields = {}, ok = 0, miss = 0, warn = 0;
  const props = objProps.flat;
  const m = rules.mappings;

  const getProp = (name) => (props[name] || '').toString().trim();
  
  const pnsKode = getProp("PNS Kode");
  const prosesskode = getProp("Prosesskode");
  const objektklasse = getProp("Objektklasse");
  const objekttype = getProp("Objekttype");
  const produkttype = getProp("Produkttype");

  const checkExpected = (propName, expectedVal, errorMsg, allowMissingExpected = false, lookupKey = "") => {
    const actualVal = getProp(propName);
    
    if (expectedVal === null || expectedVal === undefined || expectedVal === "") {
      if (allowMissingExpected) {
         if (actualVal) { fields[propName] = { status: 'warn', value: actualVal, msg: `Mangler oppslag for ${lookupKey || 'verdi'}` }; warn++; }
         else { fields[propName] = { status: 'miss', value: '', msg: 'Mangler' }; miss++; }
      } else {
         if (actualVal) { fields[propName] = { status: 'warn', value: actualVal, msg: 'Forventet blank' }; warn++; }
         else { fields[propName] = { status: 'miss', value: '', msg: 'Mangler' }; miss++; }
      }
      return;
    }

    let actComp = actualVal.toString().trim().toUpperCase();
    let expComp = expectedVal.toString().trim().toUpperCase();

    if (!isNaN(actComp) && !isNaN(expComp) && actComp !== "" && expComp !== "") {
        if (Number(actComp) === Number(expComp)) {
            actComp = "MATCH";
            expComp = "MATCH";
        }
    }

    if (actualVal === "") { fields[propName] = { status: 'miss', value: '', msg: 'Mangler' }; miss++; } 
    else if (actComp !== expComp) { fields[propName] = { status: 'warn', value: actualVal, msg: `Forventet: ${expectedVal}` }; warn++; } 
    else { fields[propName] = { status: 'ok', value: actualVal, msg: 'OK' }; ok++; }
  };

  // 1. Hovedsystem
  let hoved = null;
  if (pnsKode) {
      const pnsKey = Object.keys(m.Hovedsystem).find(k => k.trim().toUpperCase() === pnsKode.toUpperCase());
      if (pnsKey) hoved = m.Hovedsystem[pnsKey];
  }
  checkExpected("03. Bn", hoved ? hoved.Bn : null, "Feil Bn", true, pnsKode);
  checkExpected("04. Bn navn", hoved ? hoved.Bn_navn : null, "Feil Bn navn", true, pnsKode);
  checkExpected("05. Cn", hoved ? hoved.Cn : null, "Feil Cn", true, pnsKode);
  checkExpected("06. Cn navn", hoved ? hoved.Cn_navn : null, "Feil Cn navn", true, pnsKode);

  // 2. Teknisk system (v4.05: Idiot-sikker kutter med rensing av usynlige tegn)
  let tek = null;
  let pk = prosesskode.replace(/^[\s\uFEFF\xA0]+|[\s\uFEFF\xA0]+$/g, '').toUpperCase();

  while (pk.length > 0 && !tek) {
    const foundKey = Object.keys(m.TekniskSystem).find(k => k.toString().replace(/^[\s\uFEFF\xA0]+|[\s\uFEFF\xA0]+$/g, '').toUpperCase() === pk);
    
    if (foundKey) {
      tek = m.TekniskSystem[foundKey];
      break;
    }
    
    // Kutter nøyaktig ett tegn (f.eks. "74.412" -> "74.41" -> "74.4" -> "74." -> "74")
    pk = pk.slice(0, -1);
  }

  checkExpected("07. DDn", tek ? tek.DDn : null, "Feil DDn", true, prosesskode);
  checkExpected("08. DDn navn", tek ? tek.DDn_navn : null, "Feil DDn navn", true, prosesskode);

  // 3. EEE
  let eee = null;
  if (objektklasse && objekttype) {
      const eeeKeyStr = `${objektklasse}|${objekttype}`.toUpperCase();
      const eeeKey = Object.keys(m.EEE).find(k => k.trim().toUpperCase() === eeeKeyStr);
      if (eeeKey) eee = m.EEE[eeeKey];
  }
  checkExpected("09. EEEn", eee ? eee.EEEn : null, "Feil EEEn", true, `${objektklasse}|${objekttype}`);
  checkExpected("10. EEEn navn", eee ? eee.EEEn_navn : null, "Feil EEEn navn", true, `${objektklasse}|${objekttype}`);

  // 4. FFF
  let fff = null;
  if (produkttype) {
      const fffKey = Object.keys(m.FFF).find(k => k.trim().toUpperCase() === produkttype.toUpperCase());
      if (fffKey) fff = m.FFF[fffKey];
  }
  checkExpected("11. FFFn", fff ? fff.FFFn : null, "Feil FFFn", true, produkttype);
  checkExpected("12. FFFn navn", fff ? fff.FFFn_navn : null, "Feil FFFn navn", true, produkttype);

  // 5. GGGn & GGGn navn
  const ggg = getProp("13. GGGn"), gggNavn = getProp("14. GGGn navn"), fffn_expected = fff ? fff.FFFn : null;
  if (!ggg) { fields["13. GGGn"] = { status: 'miss', value: '', msg: 'Mangler' }; miss++; } 
  else {
    const fffPrefix = fffn_expected ? fffn_expected.substring(0,3).toUpperCase() : '...';
    if (new RegExp('^' + (fffn_expected ? fffn_expected.substring(0,3) : '[A-Z]{3}') + '\\d+$', 'i').test(ggg)) {
      fields["13. GGGn"] = { status: 'ok', value: ggg, msg: 'OK' }; ok++;
    } else { fields["13. GGGn"] = { status: 'warn', value: ggg, msg: `Format: ${fffPrefix} + tall` }; warn++; }
  }
  if (!gggNavn) { fields["14. GGGn navn"] = { status: 'miss', value: '', msg: 'Mangler' }; miss++; }
  else { fields["14. GGGn navn"] = { status: 'ok', value: gggNavn, msg: 'OK' }; ok++; }

  // 6 & 7. Låste strenger
  checkExpected("15. Informasjon om RDS i prosjektet", 'Se dokument "Plan for bruk av RDS.pdf"', "Feil tekst");
  checkExpected("02. AAAA_AA", "<E6RS_01>", "Feil tekst");

  // 8. 01. RDS-tag (Sammensetning)
  const actualTag = getProp("01. RDS-tag");
  const expectedTag = `${getProp("02. AAAA_AA")}-${getProp("03. Bn")}.${getProp("05. Cn")}.${getProp("07. DDn")}.${getProp("09. EEEn")}.${getProp("11. FFFn")}.${ggg}`;
  if (!actualTag) { fields["01. RDS-tag"] = { status: 'miss', value: '', msg: 'Mangler' }; miss++; } 
  else if (actualTag.toUpperCase() !== expectedTag.toUpperCase()) { fields["01. RDS-tag"] = { status: 'warn', value: actualTag, msg: `Samsvarer ikke med strukturen` }; warn++; } 
  else { fields["01. RDS-tag"] = { status: 'ok', value: actualTag, msg: 'OK' }; ok++; }

  const totalReq = ok + miss + warn;
  return { fields, score: totalReq > 0 ? Math.round((ok / totalReq) * 100) : 100, miss, warn };
}

async function validate(){
  const mid = $('modelSelect').value;
  if (!mid || !API) return;
  setStatus('⏳ Laster regler og validerer...');
  $('btnReset').disabled = true; $('btnColorize').disabled = true; $('btnExport').disabled = true; $('btnUncolor').disabled = true;
  
  try {
    // v4.05: CACHE-BUSTER! Tvinger nettleseren til å alltid hente den nyeste filen fra GitHub
    const url = $('ruleSelect').value + '?nocache=' + new Date().getTime();
    const res = await fetch(url);
    const validationRules = await res.json();
    
    let ALL_FIELDS = [];
    Object.keys(validationRules?.properties || {}).forEach(k => k.split('|').forEach(n => ALL_FIELDS.push(n.trim())));

    const model = allModels.find(m => m.id === mid);
    validationRows = [];
    skippedCount = 0;
    const CHUNK = 200;

    for (let i = 0; i < model.objectIds.length; i += CHUNK) {
      const propsArr = await API.viewer.getObjectProperties(mid, model.objectIds.slice(i, i + CHUNK));
      
      propsArr.forEach(o => {
        const ifcType = getIfcType(o);
        if (IGNORE.has(ifcType)) {
            skippedCount++;
            return;
        }

        const flat = {};
        (o.properties || []).forEach(g => (g.properties || []).forEach(p => flat[p.name] = p.value));
        
        const result = validationRules.type === 'RDS_RULESET' 
            ? runRdsValidation({flat}, validationRules) 
            : runValidation({flat}, validationRules);

        validationRows.push({
          name: o.name || 'Objekt',
          modelId: mid,
          runtimeId: o.id || o.objectRuntimeId,
          fields: result.fields,
          score: result.score,
          missCount: result.miss,
          warnCount: result.warn
        });
      });
      setStatus(`⏳ Validerer... ${Math.min(i+CHUNK, model.objectIds.length)} / ${model.objectIds.length}`);
    }

    currentRelevantFields = ALL_FIELDS.filter(f => {
       return validationRows.some(r => r.fields[f] && r.fields[f].status !== 'na');
    });

    renderDashboard(currentRelevantFields);
    setStatus('✅ Validering fullført.', 'ok');
    $('btnReset').disabled = false; $('btnColorize').disabled = false; $('btnExport').disabled = false;
  } catch(e) { setStatus('❌ Feil: ' + e.message, 'error'); console.error(e); }
}

function renderDashboard(relevantFields){
  const total = validationRows.length;
  const perfect = validationRows.filter(r => r.missCount === 0 && r.warnCount === 0).length;
  const issues = total - perfect;

  const fieldStats = relevantFields.map(f => {
    let ok = 0, applicable = 0;
    validationRows.forEach(r => {
      const st = r.fields[f]?.status;
      if (st === 'ok') { ok++; applicable++; }
      else if (st === 'miss' || st === 'warn') { applicable++; }
    });
    return { name: f, ok, applicable };
  });

  $('mainContent').innerHTML = `
    <div class="cards anim">
      <div class="card blue"><div class="label">Analysert</div><div class="value">${total}</div><div class="sub">objekter</div></div>
      <div class="card green"><div class="label">OK</div><div class="value">${perfect}</div><div class="sub">uten feil</div></div>
      <div class="card red"><div class="label">Avvik</div><div class="value">${issues}</div><div class="sub">objekter med feil</div></div>
      <div class="card gray"><div class="label">Ignorert</div><div class="value">${skippedCount}</div><div class="sub">systemnoder (Project/Site/Building)</div></div>
    </div>

    <div class="grid-2col anim" style="animation-delay:.05s">
      <div class="panel">
        <div class="panel-header"><h3>Statusfordeling</h3></div>
        <div id="donutWrap">
          <svg id="donutSvg" width="120" height="120" viewBox="0 0 120 120"></svg>
          <div class="donut-legend" id="donutLegend"></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-header"><h3>Feltdekning (Kun relevante)</h3></div>
        <div id="fieldChart"></div>
      </div>
    </div>

    <div class="panel anim" style="animation-delay:.1s; margin-top:14px;">
      <div class="panel-header"><h3>Objektliste (klikk for å markere i 3D)</h3></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Score</th><th>Navn</th>${relevantFields.map(f => `<th>${f}</th>`).join('')}</tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  `;

  renderDonut(total, perfect, issues);
  renderFieldBars(fieldStats);
  renderTable(relevantFields);
}

function renderDonut(total, ok, fail){
  const slices = [{ label: 'OK', count: ok, color: '#3fb950' }, { label: 'Feil', count: fail, color: '#f85149' }];
  const svg = $('donutSvg');
  const cx=60, cy=60, r=48;
  let offset = 0, paths = '';
  slices.forEach(s => {
    const frac = total > 0 ? s.count / total : 0;
    const len = frac * 2 * Math.PI * r;
    paths += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="18" stroke-dasharray="${len} ${2*Math.PI*r}" stroke-dashoffset="${-offset}"></circle>`;
    offset += len;
  });
  svg.innerHTML = paths + `<circle cx="${cx}" cy="${cy}" r="30" fill="var(--surface)"></circle><text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="800">${Math.round((ok/total)*100)}%</text>`;
  $('donutLegend').innerHTML = slices.map(s => `<div class="legend-item"><div class="legend-dot" style="background:${s.color}"></div><span>${s.label}: ${s.count}</span></div>`).join('');
}

function renderFieldBars(stats){
  $('fieldChart').innerHTML = stats.map(s => {
    const okPct = s.applicable > 0 ? (s.ok / s.applicable) * 100 : 0;
    return `
      <div class="field-row">
        <div class="field-name" title="${esc(s.name)}">${esc(s.name)}</div>
        <div class="bar-track"><div class="bar-fill-ok" style="width:${okPct}%"></div></div>
        <div class="bar-pct">${Math.round(okPct)}%</div>
      </div>`;
  }).join('');
}

function renderTable(relevantFields){
  $('tableBody').innerHTML = validationRows.map(r => `
    <tr data-mid="${esc(r.modelId)}" data-rid="${esc(r.runtimeId)}">
      <td>${r.score}%</td>
      <td class="obj-name" title="${esc(r.name)}">${esc(r.name)}</td>
      ${relevantFields.map(f => {
        const d = r.fields[f] || {status:'na', value:'-'};
        return `<td><span class="field-value ${d.status}" title="${esc(d.msg)}">${esc(d.value)}</span></td>`;
      }).join('')}
    </tr>
  `).join('');

  $('tableBody').querySelectorAll('tr[data-rid]').forEach(tr => {
    tr.addEventListener('click', async () => {
      const mid = tr.dataset.mid;
      const rid = Number(tr.dataset.rid);
      try {
        if (API.viewer.setSelection) {
            await API.viewer.setSelection({ modelObjectIds: [{ modelId: mid, objectRuntimeIds: [rid] }] }, 'set');
        }
      } catch(e) {}
    });
  });
}

async function colorizeModel(){
  if (!API || !validationRows.length) return;
  $('btnColorize').disabled = true;
  setStatus('🎨 Fargelegger modell…');

  try {
    const greenMap = new Map(); const yellowMap = new Map(); const redMap = new Map();

    for (const row of validationRows) {
        const mid = row.modelId;
        const rid = Number(row.runtimeId);
        if (isNaN(rid)) continue;

        const addTo = map => { if (!map.has(mid)) map.set(mid, []); map.get(mid).push(rid); };
        if (row.missCount > 0) addTo(redMap);
        else if (row.warnCount > 0) addTo(yellowMap);
        else addTo(greenMap);
    }

    const toSel = map => Array.from(map.entries()).map(([modelId, objectRuntimeIds]) => ({ modelId, objectRuntimeIds }));
    
    try { await API.viewer.setObjectState(undefined, { color: 'reset' }); } catch(e){}

    if (greenMap.size) await API.viewer.setObjectState({ modelObjectIds: toSel(greenMap) }, { color: { r: 39,  g: 174, b: 96,  a: 255 } });
    if (yellowMap.size) await API.viewer.setObjectState({ modelObjectIds: toSel(yellowMap) }, { color: { r: 210, g: 153, b: 34,  a: 255 } });
    if (redMap.size) await API.viewer.setObjectState({ modelObjectIds: toSel(redMap) }, { color: { r: 248, g: 81,  b: 73,  a: 255 } });

    $('btnUncolor').disabled = false; $('btnColorize').disabled = false;
    setStatus(`🎨 Fargelagt OK / Formatfeil / Mangler`, 'ok');
  } catch (e) { setStatus('❌ Feil ved fargelegging: ' + e.message, 'error'); }
}

async function removeColors(){
  if (!API) return;
  try {
    if (API.viewer.setObjectState) await API.viewer.setObjectState(undefined, { color: 'reset' });
    $('btnUncolor').disabled = true;
    setStatus('⬜ Modellfarger fjernet.', '');
  } catch (e) {}
}

function exportCsv(){
  const issueRows = validationRows.filter(r => r.missCount > 0 || r.warnCount > 0);
  if (!issueRows.length) {
    setStatus('✅ Ingen avvik å eksportere.', 'ok'); return;
  }

  const headers = ['Navn','ID','Score (%)','Mangler','Formatfeil', ...currentRelevantFields];
  const csvEsc = v => { const s = (v ?? '').toString().replace(/"/g, '""'); return /[",\n]/.test(s) ? `"${s}"` : s; };

  const lines = [headers.map(csvEsc).join(',')];
  for (const r of issueRows) {
    lines.push([
      csvEsc(r.name), csvEsc(r.runtimeId), csvEsc(r.score), csvEsc(r.missCount), csvEsc(r.warnCount),
      ...currentRelevantFields.map(f => {
        const d = r.fields[f];
        if (!d) return csvEsc('-');
        if (d.status === 'ok') return csvEsc('OK');
        if (d.status === 'na' || d.status === 'opt') return csvEsc(d.value);
        return csvEsc(`Feil: ${d.value} (${d.msg})`);
      })
    ].join(','));
  }

  const bom = '\ufeff';
  const blob = new Blob([bom + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'BIM_Validering_Avvik_' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(a.href);
  setStatus(`⬇ Eksportert ${issueRows.length} objekter til CSV.`, 'ok');
}

function reset(){
  validationRows = []; removeColors();
  $('mainContent').innerHTML = '<div class="empty anim">Nullstilt. Klar for ny validering.</div>';
  $('btnReset').disabled = true; $('btnColorize').disabled = true; $('btnExport').disabled = true;
  setStatus('↺ Nullstilt.', '');
}

$('btnLoad').onclick = loadModels;
$('btnValidate').onclick = validate;
$('btnColorize').onclick = colorizeModel;
$('btnUncolor').onclick = removeColors;
$('btnExport').onclick = exportCsv;
$('btnReset').onclick = reset;
connect();
</script>
