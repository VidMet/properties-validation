<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8"/>
  <title>Egenskapsvalidering v3.04</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  
  <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap');

    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --surface2:  #1f2937;
      --border:    #30363d;
      --ink:       #e6edf3;
      --muted:     #7d8590;
      --green:     #3fb950;
      --green-dim: #1a3a22;
      --yellow:    #d29922;
      --yellow-dim:#2d2205;
      --red:       #f85149;
      --red-dim:   #3a1212;
      --blue:      #58a6ff;
      --blue-dim:  #0d2044;
      --mono:      'JetBrains Mono', monospace;
      --sans:      'Syne', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body { background: var(--bg); color: var(--ink); font-family: var(--sans); min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .header-title { flex: 1; }
    .header-title h1 { font-size: 16px; font-weight: 800; letter-spacing: -.3px; color: var(--ink); }
    .header-title p { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-top: 1px; }

    .badge { font-family: var(--mono); font-size: 10px; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }

    .btn { font-family: var(--sans); font-size: 12px; font-weight: 700; padding: 7px 14px; border-radius: 6px; border: none; cursor: pointer; transition: opacity .15s, transform .1s; white-space: nowrap; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn:not(:disabled):hover { opacity: .85; }
    .btn:not(:disabled):active { transform: scale(.97); }
    .btn-primary { background: var(--blue); color: #000; }
    .btn-ghost   { background: var(--surface2); color: var(--ink); border: 1px solid var(--border); }
    .btn-danger  { background: #21262d; color: var(--red); border: 1px solid #3a1c1c; }

    #statusBar { font-family: var(--mono); font-size: 11px; padding: 6px 16px; background: var(--blue-dim); color: var(--blue); border-bottom: 1px solid #1a3a5c; flex-shrink: 0; }
    #statusBar.ok    { background: var(--green-dim); color: var(--green); border-color: #1a3a22; }
    #statusBar.error { background: var(--red-dim);   color: var(--red);   border-color: #3a1212; }

    #modelBar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 8px 16px; display: flex; gap: 15px; align-items: center; flex-shrink: 0; }
    .select-group { display: flex; align-items: center; gap: 8px; flex: 1; }
    #modelBar label { font-size: 11px; color: var(--muted); font-family: var(--mono); white-space: nowrap; }
    select { font-family: var(--mono); font-size: 12px; background: var(--surface2); color: var(--ink); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; width: 100%; min-width: 0; }
    select:disabled { opacity: .4; }

    main { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }

    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
    .card .label { font-size: 10px; color: var(--muted); font-family: var(--mono); text-transform: uppercase; letter-spacing: .5px; }
    .card .value { font-size: 28px; font-weight: 800; line-height: 1.1; margin-top: 4px; }
    .card .sub { font-size: 10px; color: var(--muted); font-family: var(--mono); margin-top: 3px; }
    .card.green .value { color: var(--green); }
    .card.red .value { color: var(--red); }
    .card.blue .value { color: var(--blue); }

    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .panel-header { padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
    .panel-header h3 { font-size: 13px; font-weight: 700; flex: 1; }
    .panel-header .hint { font-size: 10px; color: var(--muted); font-family: var(--mono); }

    #fieldChart { padding: 14px; display: flex; flex-direction: column; gap: 7px; height: 220px; overflow: auto; resize: vertical; }
    .field-row { display: flex; align-items: center; gap: 10px; }
    .field-name { font-family: var(--mono); font-size: 10px; color: var(--muted); width: 180px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-track { flex: 1; height: 16px; background: var(--surface2); border-radius: 4px; overflow: hidden; display: flex; }
    .bar-fill-ok { background: var(--green); height: 100%; transition: width .5s; }
    .bar-pct { font-family: var(--mono); font-size: 10px; width: 48px; text-align: right; flex-shrink: 0; color: var(--ink); }

    .table-wrap { overflow: auto; height: 45vh; min-height: 150px; resize: vertical; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; }
    thead th { background: var(--surface2); color: var(--muted); font-family: var(--mono); font-size: 10px; text-transform: uppercase; padding: 8px 10px; text-align: left; position: sticky; top: 0; z-index: 1; white-space: nowrap; }
    tbody tr { border-bottom: 1px solid #1c2128; cursor: pointer; }
    tbody tr:hover td { background: #1c2128; }
    tbody td { padding: 6px 10px; font-family: var(--mono); font-size: 10px; color: var(--ink); }
    .obj-name { color: var(--blue); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .field-value { display: inline-block; padding: 3px 6px; border-radius: 4px; font-size: 9px; font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; border: 1px solid transparent; }
    .field-value.ok { background: var(--green-dim); color: var(--green); border-color: #1e4028; }
    .field-value.warn { background: var(--yellow-dim); color: var(--yellow); border-color: #3a2d05; }
    .field-value.miss { background: var(--red-dim); color: var(--red); border-color: #3a1212; }
    .field-value.opt { background: #1a2027; color: var(--muted); border-color: #30363d; } /* Ny farge for Valgfri */

    #donutWrap { display: flex; align-items: center; gap: 20px; padding: 14px; min-height: 220px; }
    #donutSvg  { flex-shrink: 0; }
    .donut-legend { display: flex; flex-direction: column; gap: 6px; }
    .legend-item  { display: flex; align-items: center; gap: 8px; font-size: 11px; }
    .legend-dot   { width: 10px; height: 10px; border-radius: 50%; }

    .empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <div class="header-title">
    <h1>Egenskapsvalidering v3.04</h1>
    <p>Dynamisk kolonnefiltrering og krasj-beskyttelse</p>
  </div>
  <span class="badge" id="modelBadge">Frakoblet</span>
  <button class="btn btn-ghost" id="btnLoad" disabled>Hent modeller</button>
  <button class="btn btn-primary" id="btnValidate" disabled>▶ Valider</button>
  <button class="btn btn-danger" id="btnReset" disabled>↺ Nullstill</button>
</header>

<div id="statusBar">Kobler til Trimble Connect...</div>

<div id="modelBar">
  <div class="select-group">
    <label>Regelsett:</label>
    <select id="ruleSelect">
      <option value="0_Element.json">0_Element</option>
      <option value="1_FAG.json">1_FAG (Dynamisk)</option>
      <option value="2_RDS.json">2_RDS</option>
      <option value="3_Beskrivelse.json">3_Beskrivelse</option>
    </select>
  </div>
  
  <div class="select-group">
    <label>Modell:</label>
    <select id="modelSelect" disabled><option value="">– Laster... –</option></select>
  </div>
</div>

<main id="mainContent">
  <div class="empty">Velg et regelsett og en modell, og trykk <strong>Valider</strong>.</div>
</main>

<script>
let API = null;
let allModels = [];
let validationRows = [];
let skippedCount = 0;

const IGNORE = new Set(['IFCPROJECT','IFCSITE','IFCBUILDING','IFCBUILDINGSTOREY','IFCSPACE','IFCZONE','IFCGROUP','IFCSYSTEM']);
const $ = id => document.getElementById(id);
const setStatus = (m, c='') => { $('statusBar').textContent = m; $('statusBar').className = c; };
const lastPathPart = (v) => (v || '').split('/').pop().split('\\').pop();

async function connect(){
  try {
    API = await window.TrimbleConnectWorkspace.connect(window.parent);
    $('btnLoad').disabled = false;
    $('btnValidate').disabled = false;
    setStatus('✅ Tilkoblet Trimble Connect.', 'ok');
    $('modelBadge').textContent = 'Tilkoblet';
  } catch(e) { setStatus('❌ Kunne ikke koble til API.', 'error'); }
}

async function loadModels(){
  if (!API) return;
  setStatus('⏳ Leser modeller og filnavn...');
  try {
    const nameMap = new Map();
    const srcs = [() => API.models?.getModels(), () => API.viewer?.getModels()];
    for (const src of srcs) {
      try {
        const res = await src();
        const list = Array.isArray(res) ? res : (res?.models || res?.items || []);
        list.forEach(m => {
          const id = m.id || m.modelId;
          const fn = [m.name, m.fileName, m.filename].find(v => /\.ifc/i.test(v));
          if (id && fn) nameMap.set(id, lastPathPart(fn));
        });
      } catch(e){}
    }

    const objs = await API.viewer.getObjects();
    allModels = (objs || []).map(m => {
      const mid = m.modelId || m.modelid;
      return {
        id: mid,
        name: nameMap.get(mid) || m.name || 'Ukjent modell',
        objectIds: (m.objects || []).map(o => o.id || o.objectRuntimeId).filter(id => id != null)
      };
    }).filter(m => m.objectIds.length > 0);

    $('modelSelect').innerHTML = allModels.map(m => `<option value="${m.id}">${m.name} (${m.objectIds.length} obj)</option>`).join('');
    $('modelSelect').disabled = false;
    setStatus('✅ Modeller hentet.', 'ok');
  } catch(e) { setStatus('❌ Feil ved henting: ' + e.message, 'error'); }
}

// VALIDERINGS-MOTOREN: Tilbake med full kraft (disallowedValues, etc.)
function runValidation(objProps, fullRules) {
  let fields = {}, ok = 0, miss = 0, warn = 0;
  const props = objProps.flat;
  const mmi = parseInt(props["MMI"]) || 0;

  for (const [propKeys, rule] of Object.entries(fullRules?.properties || {})) {
    propKeys.split('|').forEach(propName => {
      propName = propName.trim();
      if (!propName) return;

      const val = props[propName] || '';
      let req = rule.requirement || rule.defaultRequirement;

      // Sikker override-sjekk med || {} for å hindre "undefined"-krasj
      if (rule.overrides) {
        const override = rule.overrides.find(o => {
          if (!o.conditions) return false;
          return Object.entries(o.conditions).every(([k, v]) => {
            const objV = String(props[k] || '').trim().toUpperCase();
            return Array.isArray(v) ? v.some(x => String(x).trim().toUpperCase() === objV) : String(v).trim().toUpperCase() === objV;
          });
        });
        if (override) req = override.requirement;
      }

      if (rule.minMMI && mmi > 0 && mmi < rule.minMMI && req === 'required') {
        req = 'optional';
      }

      let isFormatError = false;
      let errMsg = '';
      const strVal = val.toString().trim();

      // Sjekker kravnivå
      if (req === 'notallowed') {
        if (strVal !== "") {
           fields[propName] = { status: 'warn', value: val, msg: 'Ikke tillatt' }; warn++;
        } else {
           fields[propName] = { status: 'na', value: '-', msg: 'Ikke tillatt' }; // na = Ignoreres i UI
        }
        return; 
      }

      if (req === 'required' && strVal === "") {
         fields[propName] = { status: 'miss', value: '', msg: 'Mangler' }; miss++;
         return;
      }

      if (strVal === "") {
         // Den var optional og brukeren lot den stå tom (OK oppførsel)
         fields[propName] = { status: 'opt', value: '-', msg: 'Valgfri' }; 
         return;
      }

      // Verdi finnes, sjekker format og lister
      if (rule.format) {
        const regex = new RegExp(rule.format);
        if (!regex.test(val)) { isFormatError = true; errMsg = 'Feil format'; }
      }

      if (!isFormatError && rule.disallowedValues) {
        const disallowed = Array.isArray(rule.disallowedValues) ? rule.disallowedValues : [rule.disallowedValues];
        if (disallowed.some(v => String(v).trim().toUpperCase() === strVal.toUpperCase())) {
          isFormatError = true; errMsg = `Ugyldig verdi '${val}'`;
        }
      }

      if (!isFormatError && rule.allowedValues) {
        const allowed = Array.isArray(rule.allowedValues) ? rule.allowedValues : [rule.allowedValues];
        if (!allowed.some(v => String(v).trim().toUpperCase() === strVal.toUpperCase())) {
          isFormatError = true; errMsg = 'Verdi ikke i liste';
        }
      }

      if (isFormatError) {
         fields[propName] = { status: 'warn', value: val, msg: errMsg }; warn++;
      } else {
         fields[propName] = { status: 'ok', value: val, msg: 'OK' }; ok++;
      }
    });
  }

  const totalReq = ok + miss + warn;
  const score = totalReq > 0 ? Math.round((ok / totalReq) * 100) : 100;
  return { fields, score, miss, warn };
}

async function validate(){
  const mid = $('modelSelect').value;
  if (!mid || !API) return;
  setStatus('⏳ Laster regler og validerer...');
  
  try {
    const res = await fetch($('ruleSelect').value);
    const validationRules = await res.json();
    
    // Henter ut alle mulige egenskaper fra regelfilen
    let ALL_FIELDS = [];
    Object.keys(validationRules?.properties || {}).forEach(k => k.split('|').forEach(n => ALL_FIELDS.push(n.trim())));

    const model = allModels.find(m => m.id === mid);
    validationRows = [];
    skippedCount = 0;
    const CHUNK = 200;

    for (let i = 0; i < model.objectIds.length; i += CHUNK) {
      const propsArr = await API.viewer.getObjectProperties(mid, model.objectIds.slice(i, i + CHUNK));
      
      // La inn sikkerhetsnett på .properties for å hindre krasj hvis objekt mangler egenskaper
      propsArr.forEach(o => {
        const flat = {};
        (o.properties || []).forEach(g => (g.properties || []).forEach(p => flat[p.name] = p.value));
        
        const result = runValidation({flat}, validationRules);
        validationRows.push({
          name: o.name || 'Objekt',
          fields: result.fields,
          score: result.score,
          missCount: result.miss,
          warnCount: result.warn
        });
      });
      setStatus(`⏳ Validerer... ${Math.min(i+CHUNK, model.objectIds.length)} / ${model.objectIds.length}`);
    }

    // DYNAMISK FILTER: Skjuler kolonner som kun er merket som "Ikke tillatt" ('na') for hele modellen
    const relevantFields = ALL_FIELDS.filter(f => {
       return validationRows.some(r => r.fields[f] && r.fields[f].status !== 'na');
    });

    renderDashboard(relevantFields);
    setStatus('✅ Validering fullført.', 'ok');
    $('btnReset').disabled = false;
  } catch(e) { setStatus('❌ Feil: ' + e.message, 'error'); console.error(e); }
}

function renderDashboard(relevantFields){
  const total = validationRows.length;
  const perfect = validationRows.filter(r => r.missCount === 0 && r.warnCount === 0).length;
  const issues = total - perfect;

  const fieldStats = relevantFields.map(f => {
    let ok = 0, applicable = 0;
    validationRows.forEach(r => {
      const st = r.fields[f]?.status;
      if (st === 'ok') { ok++; applicable++; }
      else if (st === 'miss' || st === 'warn') { applicable++; }
    });
    return { name: f, ok, applicable };
  });

  $('mainContent').innerHTML = `
    <div class="cards">
      <div class="card blue"><div class="label">Analysert</div><div class="value">${total}</div></div>
      <div class="card green"><div class="label">OK</div><div class="value">${perfect}</div></div>
      <div class="card red"><div class="label">Avvik</div><div class="value">${issues}</div></div>
    </div>

    <div style="display:grid; grid-template-columns: 1fr 1.5fr; gap:14px; margin-top:14px;">
      <div class="panel">
        <div class="panel-header"><h3>Statusfordeling</h3></div>
        <div id="donutWrap">
          <svg id="donutSvg" width="120" height="120" viewBox="0 0 120 120"></svg>
          <div class="donut-legend" id="donutLegend"></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-header"><h3>Feltdekning (Kun relevante felt)</h3></div>
        <div id="fieldChart"></div>
      </div>
    </div>

    <div class="panel" style="margin-top:14px;">
      <div class="panel-header"><h3>Objektliste</h3></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Score</th><th>Navn</th>${relevantFields.map(f => `<th>${f}</th>`).join('')}</tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  `;

  renderDonut(total, perfect, issues);
  renderFieldBars(fieldStats);
  renderTable(relevantFields);
}

function renderDonut(total, ok, fail){
  const slices = [{ label: 'OK', count: ok, color: '#3fb950' }, { label: 'Feil', count: fail, color: '#f85149' }];
  const svg = $('donutSvg');
  const cx=60, cy=60, r=48;
  let offset = 0;
  let paths = '';
  slices.forEach(s => {
    const frac = total > 0 ? s.count / total : 0;
    const len = frac * 2 * Math.PI * r;
    paths += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="18" stroke-dasharray="${len} ${2*Math.PI*r}" stroke-dashoffset="${-offset}"></circle>`;
    offset += len;
  });
  svg.innerHTML = paths + `<circle cx="${cx}" cy="${cy}" r="30" fill="var(--surface)"></circle><text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="800">${Math.round((ok/total)*100)}%</text>`;
  $('donutLegend').innerHTML = slices.map(s => `<div class="legend-item"><div class="legend-dot" style="background:${s.color}"></div><span>${s.label}: ${s.count}</span></div>`).join('');
}

function renderFieldBars(stats){
  $('fieldChart').innerHTML = stats.map(s => {
    const okPct = s.applicable > 0 ? (s.ok / s.applicable) * 100 : 0;
    return `
      <div class="field-row">
        <div class="field-name">${s.name}</div>
        <div class="bar-track"><div class="bar-fill-ok" style="width:${okPct}%"></div></div>
        <div class="bar-pct">${Math.round(okPct)}%</div>
      </div>`;
  }).join('');
}

function renderTable(relevantFields){
  $('tableBody').innerHTML = validationRows.map(r => `
    <tr>
      <td>${r.score}%</td>
      <td class="obj-name">${r.name}</td>
      ${relevantFields.map(f => {
        const d = r.fields[f] || {status:'na', value:'-'};
        return `<td><span class="field-value ${d.status}" title="${d.msg}">${d.value}</span></td>`;
      }).join('')}
    </tr>
  `).join('');
}

function reset(){
  validationRows = [];
  $('mainContent').innerHTML = '<div class="empty">Nullstilt. Klar for ny validering.</div>';
  setStatus('↺ Nullstilt.', '');
}

$('btnLoad').onclick = loadModels;
$('btnValidate').onclick = validate;
$('btnReset').onclick = reset;
connect();
</script>
</body>
</html>
