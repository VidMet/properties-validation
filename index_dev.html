<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8"/>
  <title>Egenskapsvalidering v2.18</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  
  <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap');

    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --surface2:  #1f2937;
      --border:    #30363d;
      --ink:       #e6edf3;
      --muted:     #7d8590;
      --green:     #3fb950;
      --green-dim: #1a3a22;
      --yellow:    #d29922;
      --yellow-dim:#2d2205;
      --red:       #f85149;
      --red-dim:   #3a1212;
      --blue:      #58a6ff;
      --blue-dim:  #0d2044;
      --accent:    #58a6ff;
      --mono:      'JetBrains Mono', monospace;
      --sans:      'Syne', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .header-title { flex: 1; }
    .header-title h1 {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -.3px;
      color: var(--ink);
    }
    .header-title p {
      font-size: 11px;
      color: var(--muted);
      font-family: var(--mono);
      margin-top: 1px;
    }

    .badge {
      font-family: var(--mono);
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
      color: var(--muted);
      white-space: nowrap;
    }

    .btn {
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
      white-space: nowrap;
    }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn:not(:disabled):hover { opacity: .85; }
    .btn:not(:disabled):active { transform: scale(.97); }
    .btn-primary { background: var(--blue); color: #000; }
    .btn-ghost   { background: var(--surface2); color: var(--ink); border: 1px solid var(--border); }
    .btn-danger  { background: #21262d; color: var(--red); border: 1px solid #3a1c1c; }
    .btn-colorize { background: #1a3a22; color: var(--green); border: 1px solid #2a5a32; }
    .btn-unreset  { background: #1f2937; color: var(--muted); border: 1px solid var(--border); }
    .btn-export   { background: #0d2044; color: var(--blue); border: 1px solid #1a3a6c; }

    #statusBar {
      font-family: var(--mono);
      font-size: 11px;
      padding: 6px 16px;
      background: var(--blue-dim);
      color: var(--blue);
      border-bottom: 1px solid #1a3a5c;
      flex-shrink: 0;
    }
    #statusBar.ok    { background: var(--green-dim); color: var(--green); border-color: #1a3a22; }
    #statusBar.error { background: var(--red-dim);   color: var(--red);   border-color: #3a1212; }

    #modelBar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      display: flex;
      gap: 15px;
      align-items: center;
      flex-shrink: 0;
    }
    
    .select-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }

    #modelBar label {
      font-size: 11px;
      color: var(--muted);
      font-family: var(--mono);
      white-space: nowrap;
    }
    select {
      font-family: var(--mono);
      font-size: 12px;
      background: var(--surface2);
      color: var(--ink);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      width: 100%;
      min-width: 0;
    }
    select:disabled { opacity: .4; }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
    }
    .card .label {
      font-size: 10px;
      color: var(--muted);
      font-family: var(--mono);
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .card .value {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.1;
      margin-top: 4px;
    }
    .card .sub {
      font-size: 10px;
      color: var(--muted);
      font-family: var(--mono);
      margin-top: 3px;
    }
    .card.green  { border-color: #1e4028; }
    .card.green .value { color: var(--green); }
    .card.red    { border-color: #3a1212; }
    .card.red .value { color: var(--red); }
    .card.blue   { border-color: #0d2044; }
    .card.blue .value { color: var(--blue); }
    .card.gray   { border-color: #30363d; }
    .card.gray .value { color: var(--muted); }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .panel-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel-header h3 {
      font-size: 13px;
      font-weight: 700;
      flex: 1;
    }
    .panel-header .hint {
      font-size: 10px;
      color: var(--muted);
      font-family: var(--mono);
    }

    #fieldChart { padding: 14px; display: flex; flex-direction: column; gap: 7px; height: 220px; min-height: 80px; max-height: 600px; resize: vertical; overflow: auto; }

    .field-row { display: flex; align-items: center; gap: 10px; }
    .field-name {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      width: 180px;
      flex-shrink: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .bar-track {
      flex: 1;
      height: 16px;
      background: var(--surface2);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
    }
    .bar-fill-ok   { background: var(--green); height: 100%; transition: width .5s cubic-bezier(.4,0,.2,1); }
    .bar-fill-miss { background: var(--red);   height: 100%; transition: width .5s cubic-bezier(.4,0,.2,1); }
    .bar-pct {
      font-family: var(--mono);
      font-size: 10px;
      width: 48px;
      text-align: right;
      flex-shrink: 0;
      color: var(--ink);
    }

    .table-wrap { overflow: auto; height: 40vh; min-height: 150px; resize: vertical; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }
    thead th {
      background: var(--surface2);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .4px;
      padding: 8px 10px;
      text-align: left;
      position: sticky;
      top: 0;
      z-index: 1;
      white-space: nowrap;
    }
    tbody tr { border-bottom: 1px solid #1c2128; cursor: pointer; }
    tbody tr:hover td { background: #1c2128; }
    tbody td {
      padding: 6px 10px;
      vertical-align: middle;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--ink);
    }
    .obj-name { color: var(--blue); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .guid     { color: var(--muted); max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .guid:hover { color: var(--ink); }

    .issue-cell {
      min-width: 200px;
      max-width: 300px;
      white-space: normal;
      line-height: 1.35;
    }
    .issue-pill {
      display: inline-block;
      font-family: var(--mono);
      font-size: 10px;
      padding: 3px 7px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
    }
    .issue-pill.ok { background: var(--green-dim); color: var(--green); border-color: #1e4028; }
    .issue-pill.warn { background: var(--yellow-dim); color: var(--yellow); border-color: #3a2d05; }
    .issue-pill.miss { background: var(--red-dim); color: var(--red); border-color: #3a1212; }

    .field-value {
      display: inline-block;
      max-width: 150px;
      min-width: 72px;
      padding: 3px 7px;
      border-radius: 5px;
      font-family: var(--mono);
      font-size: 10px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border: 1px solid transparent;
    }
    .field-value.ok { background: var(--green-dim); color: var(--green); border-color: #1e4028; }
