<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8"/>
  <title>Egenskapsvalidering v3.02</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap');
    :root {
      --bg: #0d1117; --surface: #161b22; --surface2: #1f2937; --border: #30363d;
      --ink: #e6edf3; --muted: #7d8590; --green: #3fb950; --green-dim: #1a3a22;
      --yellow: #d29922; --yellow-dim: #2d2205; --red: #f85149; --red-dim: #3a1212;
      --blue: #58a6ff; --blue-dim: #0d2044; --mono: 'JetBrains Mono', monospace; --sans: 'Syne', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--ink); font-family: var(--sans); min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .header-title { flex: 1; }
    .header-title h1 { font-size: 16px; font-weight: 800; color: var(--ink); }
    .header-title p { font-size: 11px; color: var(--muted); font-family: var(--mono); }
    .badge { font-family: var(--mono); font-size: 10px; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border); color: var(--muted); }
    .btn { font-family: var(--sans); font-size: 12px; font-weight: 700; padding: 7px 14px; border-radius: 6px; border: none; cursor: pointer; transition: all .15s; white-space: nowrap; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-primary { background: var(--blue); color: #000; }
    .btn-ghost { background: var(--surface2); color: var(--ink); border: 1px solid var(--border); }
    #statusBar { font-family: var(--mono); font-size: 11px; padding: 6px 16px; background: var(--blue-dim); color: var(--blue); border-bottom: 1px solid #1a3a5c; }
    #statusBar.ok { background: var(--green-dim); color: var(--green); border-color: #1a3a22; }
    #statusBar.error { background: var(--red-dim); color: var(--red); border-color: #3a1212; }
    #modelBar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 8px 16px; display: flex; gap: 15px; align-items: center; }
    select { font-family: var(--mono); font-size: 12px; background: var(--surface2); color: var(--ink); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; width: 100%; }
    main { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }
    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
    .card .label { font-size: 10px; color: var(--muted); font-family: var(--mono); text-transform: uppercase; }
    .card .value { font-size: 28px; font-weight: 800; margin-top: 4px; }
    .card.green .value { color: var(--green); }
    .card.red .value { color: var(--red); }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .table-wrap { overflow: auto; height: 50vh; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; }
    thead th { background: var(--surface2); color: var(--muted); padding: 8px 10px; text-align: left; position: sticky; top: 0; z-index: 1; }
    tbody tr { border-bottom: 1px solid #1c2128; cursor: pointer; }
    tbody tr:hover { background: #1c2128; }
    tbody td { padding: 6px 10px; font-family: var(--mono); font-size: 10px; }
    .field-value { padding: 2px 6px; border-radius: 4px; font-size: 9px; }
    .field-value.ok { background: var(--green-dim); color: var(--green); }
    .field-value.warn { background: var(--yellow-dim); color: var(--yellow); }
    .field-value.miss { background: var(--red-dim); color: var(--red); }
    .field-value.na { background: #2a2f36; color: var(--muted); }
  </style>
</head>
<body>
<header>
  <div class="header-title"><h1>Egenskapsvalidering v3.02</h1><p>Intelligent tolkning av 1_&lt;Fag&gt;</p></div>
  <span class="badge" id="modelBadge">Frakoblet</span>
  <button class="btn btn-ghost" id="btnLoad" disabled>Hent modeller</button>
  <button class="btn btn-primary" id="btnValidate" disabled>Valider</button>
</header>
<div id="statusBar">Kobler til Trimble Connect...</div>
<div id="modelBar">
  <select id="ruleSelect">
    <option value="0_Element.json">0_Element</option>
    <option value="1_FAG.json">1_FAG (Intelligent)</option>
    <option value="2_RDS.json">2_RDS</option>
    <option value="3_Beskrivelse.json">3_Beskrivelse</option>
  </select>
  <select id="modelSelect" disabled><option value="">– Laster... –</option></select>
</div>
<main id="mainContent"></main>

<script>
let API, allModels = [], validationRows = [], validationRules = null, FIELDS = [];
const IGNORE = new Set(['IFCPROJECT','IFCSITE','IFCBUILDING','IFCBUILDINGSTOREY','IFCSPACE','IFCZONE','IFCGROUP','IFCSYSTEM']);

const $ = id => document.getElementById(id);
const setStatus = (m, c='') => { $('statusBar').textContent = m; $('statusBar').className = c; };

async function connect(){
  try {
    API = await window.TrimbleConnectWorkspace.connect(window.parent);
    $('btnLoad').disabled = false; $('btnValidate').disabled = false;
    setStatus('✅ Tilkoblet.', 'ok'); $('modelBadge').textContent = 'Tilkoblet';
  } catch(e) { setStatus('❌ API-feil.', 'error'); }
}

async function loadModels(){
  setStatus('⏳ Leser modeller...');
  const objs = await API.viewer.getObjects();
  allModels = (objs || []).map(m => ({
    id: m.modelId, name: m.name || 'Modell', ids: (m.objects || []).map(o => o.id)
  })).filter(m => m.ids.length > 0);
  $('modelSelect').innerHTML = allModels.map(m => `<option value="${m.id}">${m.name} (${m.ids.length} obj)</option>`).join('');
  $('modelSelect').disabled = false;
  setStatus('✅ Modeller klare.', 'ok');
}

// INTELLIGENT NAVNELØSER: Mapper "1_<Fag>" til "1_VAA", "1_VEI" osv.
function resolvePsetName(template, disc) {
  if (!template || !disc) return template;
  return template.replace(/<Fag>/gi, disc.toUpperCase());
}

function runValidation(objProps, rulesData) {
  let results = {}, ok = 0, miss = 0, warn = 0, na = 0;
  const props = objProps.flat;
  const disc = (props["Underdisiplinkode"] || "").toUpperCase();
  const mmi = parseInt(props["MMI"]) || 0;

  for (const [keys, rule] of Object.entries(rulesData.properties)) {
    keys.split('|').forEach(name => {
      const val = props[name] || '';
      let req = rule.requirement || rule.defaultRequirement;
      
      if (rule.overrides) {
        const match = rule.overrides.find(o => Object.entries(o.conditions).every(([k, v]) => {
          const objV = String(props[k] || '').trim().toUpperCase();
          return Array.isArray(v) ? v.some(x => x.toUpperCase() === objV) : v.toUpperCase() === objV;
        }));
        if (match) req = match.requirement;
      }

      if (rule.minMMI && mmi > 0 && mmi < rule.minMMI && req === 'required') req = 'optional';

      if (req === 'notallowed') {
        if (val.trim()) { results[name] = { st: 'warn', val, msg: 'Ikke tillatt' }; warn++; }
        else { results[name] = { st: 'na', val: '-', msg: 'OK' }; na++; }
      } else if (req === 'required' && !val.trim()) {
        results[name] = { st: 'miss', val: '', msg: 'Mangler' }; miss++;
      } else {
        results[name] = { st: 'ok', val: val || '–', msg: 'OK' }; ok++;
      }
    });
  }
  return { results, score: Math.round((ok / (ok+miss+warn)) * 100) || 100, miss, warn };
}

async function validate(){
  const mid = $('modelSelect').value;
  if (!mid) return;
  setStatus('⏳ Validerer...');
  const res = await fetch($('ruleSelect').value);
  validationRules = await res.json();
  FIELDS = [];
  Object.keys(validationRules.properties).forEach(k => k.split('|').forEach(n => FIELDS.push(n)));
  
  const m = allModels.find(x => x.id === mid);
  validationRows = [];
  const CHUNK = 200;
  for(let i=0; i<m.ids.length; i+=CHUNK){
    const props = await API.viewer.getObjectProperties(mid, m.ids.slice(i, i+CHUNK));
    props.forEach(o => {
      const flat = {}; o.properties.forEach(g => g.properties.forEach(p => flat[p.name] = p.value));
      const psets = {}; o.properties.forEach(g => psets[g.name.toUpperCase()] = true);
      
      const disc = (flat["Underdisiplinkode"] || "").toUpperCase();
      const rawPsetName = Object.values(validationRules.properties)[0].propertySet;
      const targetPset = resolvePsetName(rawPsetName, disc);

      // SJEKK: Har objektet det riktige settet? (F.eks 1_VAA)
      if (validationRules.allowExtraProperties === false && disc && !psets[targetPset]) {
         // Hvis settet mangler helt, flagger vi det som feil i dashbordet
      }

      const v = runValidation({flat}, validationRules);
      validationRows.push({ name: o.name, score: v.score, fields: v.results, miss: v.miss, warn: v.warn });
    });
    setStatus(`⏳ ${Math.min(i+CHUNK, m.ids.length)} / ${m.ids.length}`);
  }
  render();
  setStatus('✅ Fullført.', 'ok');
}

function render(){
  const total = validationRows.length;
  const okObj = validationRows.filter(r => r.miss === 0 && r.warn === 0).length;
  $('mainContent').innerHTML = `
    <div class="cards"><div class="card">ID: ${total}</div><div class="card green">OK: ${okObj}</div><div class="card red">FEIL: ${total-okObj}</div></div>
    <div class="panel"><div class="table-wrap"><table>
      <thead><tr><th>Score</th><th>Navn</th>${FIELDS.slice(0,8).map(f => `<th>${f}</th>`).join('')}</tr></thead>
      <tbody>${validationRows.map(r => `
        <tr><td>${r.score}%</td><td>${r.name || 'Objekt'}</td>
        ${FIELDS.slice(0,8).map(f => {
          const d = r.fields[f] || {st:'na', val:'-'};
          return `<td><span class="field-value ${d.st}">${d.val}</span></td>`;
        }).join('')}</tr>`).join('')}
      </tbody></table></div></div>`;
}

$('btnLoad').onclick = loadModels;
$('btnValidate').onclick = validate;
connect();
</script>
</body>
</html>
